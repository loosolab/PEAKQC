[build-system]
requires = [
    "sphinx",
    "pysam",
    "scipy",
    "matplotlib",
    "numpy",
    "pandas",
    "tqdm",
    "beartype",
    "setuptools_scm>=9.0.3"  # due to https://github.com/pypa/setuptools-scm/issues/938
]
build-backend = "setuptools.build_meta"

[project]
name = "PEAKQC"
dynamic = ["version"]
description = 'Module for quality control of ATAC-seq data'
requires-python = '>=3.9'
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jan Detleffsen" },
    { name = "Brenton Joey Bruns" },
    { name = "Mette Bentsen" },
    { name = "Carsten Kuenne" },
    { name = "Mario Looso" }
]
maintainers = [
    { name = "Jan Detleffsen", email="Jan.Detleffsen@mpi-bn.mpg.de" }
]
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
keywords = [
    "quality control",
    "single-cell",
    "single-cell analysis",
    "scATAC-seq",
    "epigenomics",
    "chromatin accessibility",
    "QC",
    "reproducible research",
    "Scanpy",
    "AnnData"
]
dependencies = [
    "scanpy>=1.9",
    "pysam",
    "scipy"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "pytest-html"
]

[project.urls]
Repository = "https://github.com/loosolab/PEAKQC"
Issues = "https://github.com/loosolab/PEAKQC/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "peakqc.__version__"}

[tool.setuptools.package-data]
peakqc = ["src/data/**/*"]

[tool.pytest.ini_options]
# durations=0 shows the ranked duration of all tests for improving compute time
addopts = """
--cov-report=term \
--cov=sctoolbox \
--junitxml=pytest.xml \
--cov-report=html:htmlcov \
--html=pytest.html \
--durations=0
"""
testpaths = [
    "./tests"
]

[tool.ruff]
# Include these directores and files
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/*.py"
]

# Exclude directories from linting
extend-exclude = [
    "src/peakqc/__init__.py"
]

[tool.ruff.lint]
# Enable rule categories
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "D",      # pydocstyle (docstring rules)
    "C90",    # mccabe complexity
    "ANN"     # flake8-annotations
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long
    "D202",  # No blank lines allowed after function docstring
    "F821"  # Undefined name
    # Note: W503 doesn't exist in ruff - line break style handled by formatters
    # Note: DOC301, DOC105 don't exist in ruff yet - not implemented from pydoclint
]

# Preview rules for pydoclint support and E226
preview = true
extend-select = [
    "DOC",  # pydoclint rules
    "E226",  # Missing whitespace around arithmetic operator (preview rule)
    "D417"  # check if docstring parameters match function signature
]

[tool.ruff.lint.pydocstyle]
# Use NumPy docstring convention
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Ignore rules in specific files
"__init__.py" = [
    "F822",  # allows undefined strings in __all__
    "DOC201",  # `return` is not documented in docstring
    "DOC501"  #  Raised exception `xyz` missing from docstring
]
"tests/*" = [
    "ANN"  # disable the flake8-annotation rules
]
